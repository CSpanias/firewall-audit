schema_version: 1
findings:
  broad-allow-rule:
    title: Allow rule has unrestricted source and destination
    commentary_title: Policies with Unrestricted Source and Destination
    category: access-control
    severity: high
    description: >-
      Enabled policy {rule_id} permits traffic with an unrestricted source and
      destination. Review the intended scope, interfaces, and required services.
    impact: >-
      An overly broad rule can permit unintended connections across network
      boundaries and increase opportunities for lateral movement.
    commentary_impact: >-
      Policies without source or destination restrictions can allow connections
      beyond those required for the intended purpose. Depending on the interfaces,
      services and other controls involved, this may weaken network segmentation
      and increase opportunities for lateral movement.
    executive_summary: >-
      Some firewall policies permitted traffic without source or destination
      restrictions, potentially allowing unintended connections and movement
      between networks.
    recommendation: >-
      Restrict the policy to documented source and destination networks and the
      minimum required services. Confirm the rule owner and business purpose.
    references:
      - title: "NIST SP 800-41 Rev. 1: Guidelines on Firewalls and Firewall Policy"
        url: https://csrc.nist.gov/pubs/sp/800/41/r1/final
  admin-services-on-wan:
    title: Firewall management services are enabled on a WAN interface
    commentary_title: Administrative Services on WAN-Facing Interfaces
    category: control-plane
    severity: high
    description: >-
      Interface {interfaces} enables {services} for management access and is
      identified as WAN-facing. The configuration alone does not establish
      internet reachability or source restrictions.
    impact: >-
      If reachable by untrusted sources, administrative interfaces may be
      exposed to credential attacks or vulnerabilities in management services.
    commentary_impact: >-
      Administrative services accessible from untrusted networks may be targeted
      through credential attacks or vulnerabilities in the management interface.
      Interface configuration alone does not establish whether these services are
      reachable or whether other controls restrict access.
    executive_summary: >-
      Firewall management services were enabled on interfaces identified as
      WAN-facing. If accessible from untrusted networks, these services could
      be targeted to gain administrative control of the device.
    recommendation: >-
      Disable administrative services on public-facing interfaces where
      possible. Otherwise restrict management to dedicated, trusted source
      networks and verify reachability controls outside this configuration.
    references:
      - title: "NIST SP 800-41 Rev. 1: Guidelines on Firewalls and Firewall Policy"
        url: https://csrc.nist.gov/pubs/sp/800/41/r1/final
  admin-service-vip-policy:
    title: Policy permits administrative services through a WAN-facing VIP
    commentary_title: Administrative Services Permitted via Virtual IPs
    category: access-control
    severity: high
    description: >-
      Enabled policy {rule_ids} permits {services} to a virtual IP configured
      on a WAN-facing interface. Verify that the mapped service is intended,
      source-restricted, and not a management plane for a network device.
    impact: >-
      If reachable from untrusted networks, administrative services on the
      mapped systems may be exposed to credential attacks or exploitation.
    commentary_impact: >-
      Where reachable from untrusted networks, administrative services may be
      targeted through credential attacks or exploitation of vulnerable systems.
      The configured services and virtual IPs do not establish the purpose of the
      mapped systems or confirm that they are externally reachable.
    executive_summary: >-
      Firewall policies permitted services commonly used for system administration
      to assets behind public or WAN-facing virtual addresses. Where accessible
      from untrusted networks, these services may increase exposure to credential
      attacks or exploitation of vulnerable systems.
    recommendation: >-
      Remove unnecessary administrative-service publishing. If required,
      restrict source networks, use a hardened management gateway, and verify
      the mapped host and service owner.
    references:
      - title: "NIST SP 800-41 Rev. 1: Guidelines on Firewalls and Firewall Policy"
        url: https://csrc.nist.gov/pubs/sp/800/41/r1/final
  legacy-service-policy:
    title: Policy references clear-text or legacy network services
    commentary_title: Legacy, Clear-Text and Broadly Defined Services
    category: access-control
    severity: high
    description: >-
      Enabled allow policy {rule_ids} references {services}, which includes
      clear-text or legacy protocols or an unrestricted service definition.
      Confirm the actual protocol and business requirement.
    impact: >-
      Clear-text services can expose credentials and traffic to interception;
      unrestricted services may permit protocols beyond those required.
    commentary_impact: >-
      Clear-text protocols may expose sensitive information to interception where
      traffic traverses untrusted networks. Broad service definitions can also
      permit more network access than is required for the underlying business
      purpose. A broad definition does not by itself establish which protocols
      are actually in use.
    executive_summary: >-
      Some policies referenced legacy services or broadly defined services
      that may permit clear-text protocols and increase the risk of sensitive
      information being intercepted during transmission.
    recommendation: >-
      Replace legacy protocols with secure alternatives, disable unused
      services and helpers, and explicitly restrict or block insecure services.
    references:
      - title: "NIST SP 800-41 Rev. 1: Guidelines on Firewalls and Firewall Policy"
        url: https://csrc.nist.gov/pubs/sp/800/41/r1/final
      - title: "NIST SP 800-52 Rev. 2: Guidelines for TLS Implementations"
        url: https://csrc.nist.gov/pubs/sp/800/52/r2/final
  logging-coverage-gap:
    title: Remote logging is absent or not enabled
    commentary_title: Centralised Logging Configuration
    category: logging
    severity: medium
    description: >-
      No enabled Syslog or FortiAnalyzer destination was identified. Without
      centralized event collection, incident investigation and monitoring may
      be incomplete.
    impact: >-
      Missing centralized logs can reduce detection visibility and limit
      evidence available for incident investigation.
    commentary_impact: >-
      Centralised collection supports monitoring and incident investigation by
      making firewall events available alongside other security records. Without
      an identified destination, the availability of these events for central
      monitoring could not be established.
    executive_summary: >-
      No enabled central logging destination was identified, which may reduce
      monitoring visibility and the evidence available for investigations.
    recommendation: >-
      Configure an approved centralized logging destination, enable the
      required event categories and policy logging, and validate ingestion,
      retention, access controls, and alerting.
    references:
      - title: "NIST SP 800-92: Guide to Computer Security Log Management"
        url: https://csrc.nist.gov/pubs/sp/800/92/final
  policy-logging-gap:
    title: Some enabled policies explicitly disable traffic logging
    commentary_title: Policy Traffic Logging
    category: logging
    severity: low
    description: >-
      Enabled policies {rule_ids} explicitly disable traffic logging. Confirm
      that these exclusions are intentional and that equivalent monitoring is
      available.
    impact: >-
      Unlogged traffic can leave gaps in monitoring and incident investigation.
    commentary_impact: >-
      Where traffic is not logged and equivalent monitoring is unavailable,
      connections permitted by these policies may be harder to investigate or
      correlate with other security events.
    executive_summary: >-
      Traffic logging was explicitly disabled on some permitted policies,
      potentially leaving gaps in monitoring and incident investigations.
    recommendation: >-
      Enable policy logging where operationally appropriate and ensure
      exceptions are documented, monitored, and periodically reviewed.
    references:
      - title: "NIST SP 800-92: Guide to Computer Security Log Management"
        url: https://csrc.nist.gov/pubs/sp/800/92/final
  local-admin-auth:
    title: Firewall administrators have no configured central AAA server
    commentary_title: Administrative Authentication Configuration
    category: administration
    severity: medium
    description: >-
      {admin_count} administrator account(s) were identified, but no configured
      RADIUS, LDAP, or TACACS+ server was found. Authentication centralization
      and account lifecycle controls should be reviewed.
    impact: >-
      Reliance on local accounts can make consistent access control, account
      lifecycle management, and administrator auditing harder to enforce.
    commentary_impact: >-
      Centralised authentication can support consistent account lifecycle
      management, accountability and auditing. Reliance on locally managed
      accounts may make these controls more difficult to enforce consistently.
    executive_summary: >-
      No central authentication service was identified for administrative access
      to the firewall, which may make access management, accountability and
      auditing more difficult to enforce consistently.
    recommendation: >-
      Where supported by operational requirements, use centrally managed
      administrator authentication with MFA. Review local accounts, trusted
      hosts, role assignments, and emergency-access procedures.
    references:
      - title: "NIST SP 800-63B-4: Authentication and Authenticator Management"
        url: https://csrc.nist.gov/pubs/sp/800/63/b/4/final
  ntp-server-review:
    title: No explicit trusted NTP server is configured
    commentary_title: Time Synchronisation Configuration
    category: monitoring
    severity: medium
    description: >-
      NTP synchronization is {sync_state}, but no explicit NTP server entry
      was found in the configuration. The time source and its trust boundary
      could not be verified.
    impact: >-
      Inaccurate or untrusted timestamps can hinder correlation of events and
      the investigation of security incidents.
    commentary_impact: >-
      Accurate and trusted timestamps support security monitoring, event
      correlation and investigations. Without an explicit server entry, it was
      not possible to determine the time source or whether firewall logs are
      synchronised with the wider monitoring infrastructure.
    executive_summary: >-
      The configured time source could not be verified through an explicitly
      defined Network Time Protocol (NTP) server, potentially affecting the
      accuracy of event timestamps and the effectiveness of security investigations.
    recommendation: >-
      Configure approved time sources, restrict NTP access to those sources,
      and verify synchronized time across the firewall and monitoring systems.
    references:
      - title: "RFC 8915: Network Time Security for the Network Time Protocol"
        url: https://www.rfc-editor.org/info/rfc8915
  temporary-access-review:
    title: Potential temporary access requires review
    commentary_title: Potential Temporary or Assessment Access
    category: access-control
    severity: info
    description: >-
      Enabled allow rules {rule_ids} explicitly reference a supplied assessment
      host or contain terms suggesting temporary or testing-related access.
      The intended duration and continued need could not be established.
    impact: >-
      Access that is no longer required may retain unnecessary connectivity
      between systems and increase the potential attack surface.
    commentary_impact: >-
      Temporary access that remains in place beyond its intended use may permit
      unnecessary connections. The configuration alone does not establish when
      the access was approved, whether it has expired or whether it remains
      required.
    executive_summary: >-
      Some rules explicitly referenced assessment hosts or included terms
      suggesting temporary or testing-related access. Their intended duration
      and continued business need could not be established from the configuration.
    recommendation: >-
      Confirm the owner, purpose and approved duration of the affected access
      with the firewall owner. Remove access that is no longer required and
      document or time-limit any access that must remain.
    references:
      - title: "NIST SP 800-41 Rev. 1: Guidelines on Firewalls and Firewall Policy"
        url: https://csrc.nist.gov/pubs/sp/800/41/r1/final
